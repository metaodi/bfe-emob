name: Check scraper health

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    env:
      ISSUE_TITLE: "Scraper data is stale"
    steps:
      - name: Check out this repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # need full history to inspect commit times

      - name: Check file freshness
        id: freshness
        run: |
          FILES=(
            "data/ch.bfe.ladestellen-elektromobilitaet-status.json"
            "data/ch.bfe.ladestellen-elektromobilitaet_de.json"
          )

          TWO_HOURS_AGO=$(date -u -d '2 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
          STALE_FILES=""

          for FILE in "${FILES[@]}"; do
            LAST_COMMIT_DATE=$(git log -1 --format='%aI' -- "$FILE")
            if [ -z "$LAST_COMMIT_DATE" ]; then
              STALE_FILES="$STALE_FILES\n- \`$FILE\` (no commits found)"
              continue
            fi
            LAST_EPOCH=$(date -u -d "$LAST_COMMIT_DATE" '+%s')
            THRESHOLD_EPOCH=$(date -u -d "$TWO_HOURS_AGO" '+%s')
            if [ "$LAST_EPOCH" -lt "$THRESHOLD_EPOCH" ]; then
              STALE_FILES="$STALE_FILES\n- \`$FILE\` (last updated: $LAST_COMMIT_DATE)"
            fi
          done

          if [ -n "$STALE_FILES" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            # use a delimiter for multi-line output
            {
              echo "stale_files<<EOF"
              echo -e "$STALE_FILES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find existing open issue
        id: find_issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = process.env.ISSUE_TITLE;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'scraper-health',
              per_page: 100,
            });
            const issue = issues.data.find(i => i.title === title);
            if (issue) {
              core.setOutput('issue_number', issue.number);
            } else {
              core.setOutput('issue_number', '');
            }

      - name: Open or update issue when data is stale
        if: steps.freshness.outputs.stale == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = '${{ steps.find_issue.outputs.issue_number }}';
            const staleFiles = `${{ steps.freshness.outputs.stale_files }}`;
            const body = `The following data files have **not** been updated in the last 2 hours:\n\n${staleFiles}\n\nPlease check the scraper workflow.`;

            if (issueNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(issueNumber),
                body: `⚠️ Still stale as of ${new Date().toISOString()}:\n\n${staleFiles}`,
              });
              core.info(`Commented on existing issue #${issueNumber}`);
            } else {
              // ensure the label exists
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'scraper-health',
                });
              } catch {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'scraper-health',
                  color: 'd93f0b',
                  description: 'Automated scraper health monitoring',
                });
              }

              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: process.env.ISSUE_TITLE,
                body: body,
                labels: ['scraper-health'],
              });
              core.info(`Opened new issue #${created.data.number}`);
            }

      - name: Close issue when data is fresh
        if: steps.freshness.outputs.stale == 'false' && steps.find_issue.outputs.issue_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number('${{ steps.find_issue.outputs.issue_number }}');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `✅ Data files are up-to-date again as of ${new Date().toISOString()}. Closing this issue.`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed',
            });
            core.info(`Closed issue #${issueNumber}`);
