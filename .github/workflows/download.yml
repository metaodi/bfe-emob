name: Download latest data

on:
  workflow_dispatch:
  schedule:
  - cron: '*/8 * * * *' # runs every 8mins

# shared with build-parquet.yml: never run while the Parquet files are built
# (only one run of the group at a time, later runs wait)
concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  scheduled:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Check out this repo
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: ".python-version"
    
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    - name: Install the dependencies
      run: |
        uv sync --locked --all-extras --dev

    - name: Download latest data
      run: uv run download_data.py
    
    - name: Commit and push if it changed
      # also commit partial results if one of the sources failed
      if: ${{ !cancelled() }}
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        timestamp=$(date -u)
        git commit -m "Latest data: ${timestamp}" || exit 0
        # downloads are blocked by the concurrency group, rebase/retry only as a safeguard
        for i in 1 2 3 4 5; do
          git pull --rebase origin ${{ github.ref_name }} && git push && exit 0
          sleep $((i * 10))
        done
        exit 1
